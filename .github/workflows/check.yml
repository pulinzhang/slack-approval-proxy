# push / pull request: Ruff, Mypy, tests.
# This repo has no deploy host yet. The costing platform's SSH deploy job is not copied.
name: Check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check app tests main.py
          python -m ruff format --check app tests main.py
      - name: Mypy
        run: python -X utf8 -m mypy app
      - name: Tests
        run: python -X utf8 -m pytest -m "not integration" -q
