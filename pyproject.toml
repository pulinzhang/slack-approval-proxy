[project]
name = "slack-approval-proxy"
version = "0.1.0"
description = "Slack Approval Proxy — cross-system approval cards and message trace"
authors = [
    {name = "Development Team"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "httpx==0.26.0",
    "aiosqlite==0.20.0",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.8",
    "ruff==0.5.0",
    "mypy==1.8.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "W",
  "UP",
  "RUF",
  "SIM",
  "PLE",
  "FLY",
  "B",
]
ignore = [
  "B008",
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_calls = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests that need a real Slack workspace",
]
